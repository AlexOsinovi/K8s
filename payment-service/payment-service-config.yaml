apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: innowise
data:
  SERVER_PORT: "8085"
  SPRING_DATA_MONGODB_DATABASE: "payment_service_db"
  SPRING_DATA_MONGODB_HOST: "payment-mongo"
  SPRING_DATA_MONGODB_PORT: "27017"
  SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: "admin"
  RANDOM_API_URL: "https://www.random.org"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_KAFKA_TOPICS_ORDERS: "orders-topic"
  SPRING_KAFKA_TOPICS_PAYMENTS: "payments-topic"
  SPRING_KAFKA_CONSUMER_GROUP_ID: "payment-group"
  SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: "org.apache.kafka.common.serialization.StringSerializer"
  SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: "org.springframework.kafka.support.serializer.JsonSerializer"
  SPRING_KAFKA_PRODUCER_PROPERTIES_SPRING_JSON_ADD_TYPE_HEADERS: "false"
  SPRING_KAFKA_PRODUCER_PROPERTIES_TRANSACTIONAL_ID: "payment-service-1"
  SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: "org.apache.kafka.common.serialization.StringDeserializer"
  SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: "org.springframework.kafka.support.serializer.JsonDeserializer"
  SPRING_KAFKA_CONSUMER_ISOLATION_LEVEL: "read_committed"
  SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "by.osinovi.*"
  SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE: "by.osinovi.paymentservice.dto.OrderMessage"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"